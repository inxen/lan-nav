name: Build & Release

# 触发时机：
#   - 推送到 main 分支 → 仅重建 latest Docker 镜像（不发布 Release）
#   - 打 v* tag（如 v1.0.0）→ 同时：构建多架构 Docker 镜像 + 编译各平台原生二进制并发布 GitHub Release
#   - 发起 PR 到 main → 仅构建验证（Docker 不推送、不发布 Release）
on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]

# ghcr.io 推送 + GitHub Release 创建/上传都需要写权限（复用 GITHUB_TOKEN，无需额外 secret）
# Docker Hub 不走这里的 permissions，用的是 DOCKERHUB_USERNAME / DOCKERHUB_TOKEN 两个 secret
permissions:
  contents: write
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        # 启用 QEMU 模拟，让 x86 runner 能交叉构建 ARM/POWER/s390x 等架构
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        # 凭据只从 secret DOCKERHUB_TOKEN 取（Read & Write 的 PAT）。
        # 用户名直接写死：它本就是公开信息（镜像名 oinxen/lan-nav 里就有），
        # 早先试过放进 secret，反而因为值不干净导致
        # "malformed HTTP Authorization header"，排查成本极高。
        #
        # 用 shell 调 docker login 而非 docker/login-action：先剔除 token 里
        # 可能混入的 \r\n 与首尾空白，避免不可见的粘贴污染带进 Authorization 头。
        if: github.event_name != 'pull_request'
        env:
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          U=oinxen
          T=$(printf '%s' "${DH_TOKEN}" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
          if [ -z "${T}" ]; then
            echo "::error title=Docker Hub token 为空::仓库 secret DOCKERHUB_TOKEN 为空，请补上 Read & Write 的 PAT"
            exit 1
          fi
          printf '%s' "${T}" | docker login --username "${U}" --password-stdin docker.io

      - name: Extract metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          # 多值：每行一个镜像基名，下面的 tags 规则会分别派生到每个镜像
          images: |
            oinxen/lan-nav
            ghcr.io/${{ github.repository }}
          tags: |
            # v1.2.3 → 1.2.3
            # （flavor.latest 默认 auto，semver 命中时会自动追加 latest）
            type=semver,pattern={{version}}
            # 默认分支（main）→ latest
            # （tag 事件下 is_default_branch=false，本条不生效，与上面的 auto latest 互斥）
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          # 多架构镜像：覆盖市面主流部署平台。
          # amd64=通用 x86_64 服务器/桌面；arm64=Apple Silicon / 树莓派4-5 / ARM 云(Graviton)；
          # arm/v7=树莓派2-3(32位)；arm/v6=树莓派1/Zero；ppc64le=IBM POWER；s390x=IBM Z。
          platforms: linux/amd64,linux/arm64,linux/arm/v7,linux/arm/v6,linux/ppc64le,linux/s390x
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 利用 GitHub Actions 缓存加速层构建
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    # 仅在打 v* tag 时编译各平台原生二进制（产物作为 artifact，交由 publish 任务统一发布）
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    strategy:
      # 单个平台失败不影响其余；且避免并发上传 Release 造成竞态
      fail-fast: false
      matrix:
        include:
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: linux,   goarch: arm,    goarm: "7" }
          - { goos: linux,   goarch: arm,    goarm: "6" }
          - { goos: linux,   goarch: ppc64le }
          - { goos: linux,   goarch: s390x }
          - { goos: darwin,  goarch: amd64 }
          - { goos: darwin,  goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Build single-file binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: "0"
        run: |
          EXT=""
          if [ "$GOOS" = "windows" ]; then EXT=".exe"; fi
          NAME="lan-nav-${GOOS}-${GOARCH}${GOARM:+v${GOARM}}${EXT}"
          mkdir -p dist
          cd backend
          go build -a -o "../dist/$NAME" .
          echo "built $NAME"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: lan-nav-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goarm && format('v{0}', matrix.goarm) }}
          path: dist/*
          if-no-files-found: error

  publish:
    # 汇总所有平台的 artifact，一次性创建 GitHub Release 并附上全部二进制
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          # 只取 release 任务产出的二进制。
          # docker 任务使用 cache-to: type=gha 时，buildx 会在同一个 run 里留下一个
          # <owner>~<repo>~xxxx.dockerbuild 内部 artifact；不加 pattern 会把它一并
          # 下载并平铺进 dist，导致合并失败、Release 无法生成。
          pattern: lan-nav-*
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
