name: Build & Release

# 触发时机：
#   - 推送到 main 分支 → 仅重建 latest Docker 镜像（不发布 Release）
#   - 打 v* tag（如 v1.0.0）→ 同时：构建多架构 Docker 镜像 + 编译各平台原生二进制并发布 GitHub Release
#   - 发起 PR 到 main → 仅构建验证（Docker 不推送、不发布 Release）
on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]

# ghcr.io 推送 + GitHub Release 创建/上传都需要写权限（复用 GITHUB_TOKEN，无需额外 secret）
permissions:
  contents: write
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        # 启用 QEMU 模拟，让 x86 runner 能交叉构建 ARM/POWER/s390x 等架构
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            # v1.2.3 → 1.2.3
            type=semver,pattern={{version}}
            # 默认分支（main）→ latest
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          # 多架构镜像：覆盖市面主流部署平台。
          # amd64=通用 x86_64 服务器/桌面；arm64=Apple Silicon / 树莓派4-5 / ARM 云(Graviton)；
          # arm/v7=树莓派2-3(32位)；arm/v6=树莓派1/Zero；ppc64le=IBM POWER；s390x=IBM Z。
          platforms: linux/amd64,linux/arm64,linux/arm/v7,linux/arm/v6,linux/ppc64le,linux/s390x
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 利用 GitHub Actions 缓存加速层构建
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    # 仅在打 v* tag 时编译各平台原生二进制（产物作为 artifact，交由 publish 任务统一发布）
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    strategy:
      # 单个平台失败不影响其余；且避免并发上传 Release 造成竞态
      fail-fast: false
      matrix:
        include:
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: linux,   goarch: arm,    goarm: "7" }
          - { goos: linux,   goarch: arm,    goarm: "6" }
          - { goos: linux,   goarch: ppc64le }
          - { goos: linux,   goarch: s390x }
          - { goos: darwin,  goarch: amd64 }
          - { goos: darwin,  goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Build single-file binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: "0"
        run: |
          EXT=""
          if [ "$GOOS" = "windows" ]; then EXT=".exe"; fi
          NAME="lan-nav-${GOOS}-${GOARCH}${GOARM:+v${GOARM}}${EXT}"
          mkdir -p dist
          cd backend
          go build -a -o "../dist/$NAME" .
          echo "built $NAME"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: lan-nav-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goarm && format('v{0}', matrix.goarm) }}
          path: dist/*
          if-no-files-found: error

  publish:
    # 汇总所有平台的 artifact，一次性创建 GitHub Release 并附上全部二进制
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
