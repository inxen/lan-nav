name: Docker

# 触发时机：
#   - 推送到 main 分支 → 构建并推送 latest 镜像
#   - 打 v* tag（如 v1.2.3）→ 额外构建并推送语义版本标签
#   - 发起 PR 到 main → 仅构建验证，不推送
on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]

# ghcr.io 推送需要 packages: write 权限（复用 GITHUB_TOKEN，无需额外 secret）
permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        # 启用 QEMU 模拟，让 x86 runner 能交叉构建 ARM/POWER/s390x 等架构
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            # v1.2.3 → 1.2.3
            type=semver,pattern={{version}}
            # 默认分支（main）→ latest
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          # 多架构镜像：覆盖市面主流部署平台。
          # amd64=通用 x86_64 服务器/桌面；arm64=Apple Silicon / 树莓派4-5 / ARM 云(Graviton)；
          # arm/v7=树莓派2-3(32位)；arm/v6=树莓派1/Zero；ppc64le=IBM POWER；s390x=IBM Z。
          # riscv64 因仍处实验阶段、QEMU/registry 支持不稳定，暂不纳入以免拖垮整体构建。
          platforms: linux/amd64,linux/arm64,linux/arm/v7,linux/arm/v6,linux/ppc64le,linux/s390x
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 利用 GitHub Actions 缓存加速层构建
          cache-from: type=gha
          cache-to: type=gha,mode=max
